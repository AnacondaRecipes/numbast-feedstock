{% set number = 0 %}
{% set name = "numbast" %}
{% set version = "0.10.1" %}
{% set sha256 = "cd52bbcc616d870458891ff816d9199afffa9500936bb81a0c4499d3003fed4c" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://github.com/NVIDIA/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: {{ number }}
  skip: true  # [win or osx]

outputs:
  - name: ast_canopy
    version: {{ version }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake >=3.29
        - ninja-base
      host:
        - python
        - pip
        # 3.0.x gives pybind11-abi 11, matching numba-cuda-mlir 0.4.2 on pkgs/main;
        # pybind11 3.1 (abi 12) would make the two packages impossible to co-install.
        - pybind11 3.0.4
        - pybind11-abi
        - setuptools_scm
        - scikit-build-core
        # Upstream allows clangdev >=18,<22. llvmdev/llvm must match clangdev's
        # version: ast_canopy links libclang-cpp and libLLVM together.
        - clangdev 21.1.8
        - llvmdev 21.1.8
        - llvm 21.1.8
        # Linked instead of the static Clang archives (see build-astcanopy.sh);
        # its run_exports pin the libclang-cpp runtime.
        - libclang-cpp 21.1.8
      run:
        - python
        # v0.10.1's rsqrt header shim covers CUDA 13.2, not later 13.x headers.
        - cuda-version >=12.5,<13.3
        - cuda-nvcc
        - clangdev >=18,<22
        # Needed by clang CUDA wrappers at runtime.
        - libcurand-dev
        - cuda-pathfinder >=1.3,<2
    build:
      number: {{ number }}
      skip: true  # [win or osx]
      script: bash {{ RECIPE_DIR }}/build-astcanopy.sh
    test:
      imports:
        - ast_canopy
      source_files:
        - ast_canopy/tests/data/inline_hint_macro_fix.cu
      requires:
        - pip
      commands:
        - pip check
        - test -f $PREFIX/lib/libastcanopy.so
        # Parse a CUDA header (no GPU needed); fixture is upstream's 0.10.1 regression test.
        - python -c 'import os, ast_canopy; f = os.path.abspath("ast_canopy/tests/data/inline_hint_macro_fix.cu"); d = ast_canopy.parse_declarations_from_source(f, [f], "sm_80"); r = dict((x.name, x.return_type.name) for x in d.functions); assert r["inline_hint_void"] == "void" and r["inline_hint_int"] == "int", r'
    about:
      home: https://github.com/NVIDIA/numbast
      summary: CUDA C++ device-function header parser used by Numbast
      description: >-
        ast_canopy parses CUDA C++ headers with Clang and exposes the declared
        functions, structs, templates and enums to Python. Numbast uses it to
        generate Numba CUDA bindings.
      license: Apache-2.0
      license_family: Apache
      license_file: LICENSE
      doc_url: https://github.com/NVIDIA/numbast
      dev_url: https://github.com/NVIDIA/numbast

  - name: numbast
    build:
      number: {{ number }}
      # Upstream requires-python is >=3.7.
      skip: true  # [win or osx or py<37]
      script: bash {{ RECIPE_DIR }}/build-numbast.sh
      entry_points:
        - numbast = numbast.tools.static_binding_generator:static_binding_generator
    requirements:
      host:
        - python
        - pip
        - setuptools >=61.0
        - setuptools_scm
      run:
        - python
        - ast_canopy >=0.5.0
        # v0.10.1's rsqrt header shim covers CUDA 13.2, not later 13.x headers.
        - cuda-version >=12.5,<13.3
        - cuda-nvrtc
        - numba-cuda >=0.25.0
        # numba-cuda 0.30.4 uses np.row_stack, removed in NumPy 2.5. Bound added
        # upstream after 0.10.1: https://github.com/NVIDIA/numbast/pull/386
        - numpy <2.5
        - pyyaml
        - click
        - jinja2
    test:
      imports:
        - numbast
        # MLIR backend (numbast[mlir]); numba-cuda-mlir has no py310 build on pkgs/main.
        - numbast.experimental.mlir  # [py>=311]
      requires:
        - pip
        - numba-cuda-mlir  # [py>=311]
      commands:
        - pip check
        # numbast writes a debug log to gettempdir()/numbast_function.log; use a
        # private TMPDIR so a leftover root-owned /tmp file can't block reopen.
        - TMPDIR=$(mktemp -d) python -m numbast --help
        - TMPDIR=$(mktemp -d) numbast --help
        # These MLIR modules open the same debug log at import time, so they need the private TMPDIR too.
        - TMPDIR=$(mktemp -d) python -c "import numbast.experimental.mlir.static, numbast.experimental.mlir.tools.static_binding_generator"  # [py>=311]
    about:
      home: https://github.com/NVIDIA/numbast
      summary: CUDA C++ to numba.cuda binding generator
      description: >-
        Numbast bridges CUDA C++ and Numba CUDA: it reads CUDA C++ headers (via the
        ast_canopy libclang-based parser) and generates Numba CUDA bindings so the
        declared types and device functions can be called from numba.cuda kernels.
      license: Apache-2.0
      license_family: Apache
      license_file: LICENSE
      doc_url: https://github.com/NVIDIA/numbast
      dev_url: https://github.com/NVIDIA/numbast

about:
  home: https://github.com/NVIDIA/numbast
  summary: CUDA C++ to numba.cuda binding generator
  description: >-
    Numbast bridges CUDA C++ and Numba CUDA: it reads CUDA C++ headers (via the
    ast_canopy libclang-based parser) and generates Numba CUDA bindings so the
    declared types and device functions can be called from numba.cuda kernels.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://github.com/NVIDIA/numbast
  dev_url: https://github.com/NVIDIA/numbast

extra:
  skip-lints:
    # llvm/llvmdev are linked as libraries (libLLVM) by ast_canopy, not used as
    # compilers — the C/C++ compilers are already provided via {{ compiler() }}.
    - should_use_compilers
    # conda-build builds green with script under outputs/x/build/script; the
    # outputs/x/script form the linter prefers crashes anaconda-linter
    # (internal error on output_missing_name), so keep build/script.
    - wrong_output_script_key
  feedstock-name: numbast
  recipe-maintainers:
    - cryos
    - isvoid
    - conda-forge/cuda-python
